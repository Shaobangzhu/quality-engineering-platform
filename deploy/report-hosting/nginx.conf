worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr crit;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    default_type text/plain;
    types { text/html html; }

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080 default_server;
        server_name _;
        root /srv/qep-public/current;
        # The publisher owns the current pointer. The report itself is a regular file.
        disable_symlinks on from=$document_root;
        autoindex off;
        open_file_cache off;
        etag off;
        if_modified_since off;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' data:; img-src data: blob:; font-src data:; connect-src data: blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        # Check the original path before matching normalized Nginx locations.
        if ($request_uri !~ "^/(index[.]html)?([?].*)?$") {
            return 404;
        }
        if ($request_method !~ "^(GET|HEAD)$") {
            return 403;
        }

        location = / {
            try_files /index.html =404;
        }
        location = /index.html {
            try_files /index.html =404;
        }
        location / {
            return 404;
        }
    }
}
